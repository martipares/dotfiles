format = """
[┌──](fg)\
$username\
[@](bold purple)\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$jobs\
$time\
$battery\
$line_break\
[│](fg)\
$line_break\
[└─](fg)\
$character"""

add_newline = false

continuation_prompt = '└─❯ '

[username]
format = '\[[$user]($style)'
show_always = true
style_user = 'fg'
style_root = 'bold yellow'

[hostname]
ssh_only = false
format = '[$hostname]($style) '
style = 'fg'

[directory]
style = 'bold cyan'
format = '[$path ]($style)[$read_only]($read_only_style)\]'
truncation_symbol = '…/'
truncation_length = 3
truncate_to_repo = false
home_symbol = '~'




[fill]
# symbol = '·'
symbol = '─'
style = 'white'

[character]
format = '$symbol '
success_symbol = '[❯](bold fg)'
error_symbol = '[❯](bold red)'

[git_branch]
format = ' [$symbol$branch(:$remote_branch)]($style) '
style = 'green'


[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
deleted = '✘ '

[time]
disabled = false
format = ' [$time]($style)'
style = 'dimmed'

[jobs]
format = ' [$number$symbol]($style)'

[cmd_duration]
format = ' [$duration]($style)'

[battery]
format = ' [$symbol$percentage]($style) '
disabled = true

[[battery.display]]
threshold = 100
style = 'green'

